version: 2
# Grouped updates => fewer PRs. Minor/patch bumps arrive as one PR per ecosystem;
# major bumps get their own grouped PR so breaking changes are reviewed separately.
# Every Dependabot PR still requires manual review + green CI before merge.
# (No npm ecosystem: the repo has no package.json — add an entry here if one is introduced.)
updates:
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      gradle-minor-patch:
        update-types: ["minor", "patch"]
      gradle-major:
        update-types: ["major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
      actions-major:
        update-types: ["major"]
