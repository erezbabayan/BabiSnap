plugins { id 'com.android.application' }

def ksProps = new Properties()
def ksFile = file(System.getenv('VOICECAL_KEYSTORE_PROPS') ?: '/workspace/secrets/voicecal-keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

// SNAP_REGISTRY_CLIENT_KEY only. Env (CI secret) wins, else android/local.properties (gitignored).
// Never read SNAP_REGISTRY_ADMIN_KEY — that secret stays on the server and must not enter the APK.
// Empty client key is allowed — the client then skips the registry so calendar / pairing still work.
def snapProps = new Properties()
def snapLocal = rootProject.file('local.properties')
if (snapLocal.exists()) snapLocal.withInputStream { snapProps.load(it) }
def snapKey = System.getenv('SNAP_REGISTRY_CLIENT_KEY')
if (snapKey == null || snapKey.trim().isEmpty()) snapKey = snapProps.getProperty('SNAP_REGISTRY_CLIENT_KEY', '')
if (snapKey == null) snapKey = ''
snapKey = snapKey.trim()

def quoteJavaString = { String s ->
    StringBuilder sb = new StringBuilder(s.length() + 2)
    sb.append('"')
    for (int i = 0; i < s.length(); i++) {
        char ch = s.charAt(i)
        if (ch == '\\' || ch == '"') sb.append('\\').append(ch)
        else if (ch == '\n') sb.append('\\n')
        else if (ch == '\r') sb.append('\\r')
        else if (ch == '\t') sb.append('\\t')
        else sb.append(ch)
    }
    sb.append('"')
    sb.toString()
}

android {
    namespace = 'com.babisnap.app'
    compileSdk = 35
    defaultConfig {
        applicationId = 'com.babisnap.app'
        minSdk = 26
        targetSdk = 34
        versionCode = 37
        versionName = '2.26'
        // Live snap_users endpoint. Bearer value is the client key injected above — never the admin key.
        buildConfigField "String", "SNAP_REGISTRY_URL", '"https://ghibfuinantybqidwadj.supabase.co/functions/v1/snap-users"'
        buildConfigField "String", "SNAP_REGISTRY_CLIENT_KEY", quoteJavaString(snapKey)
    }
    buildFeatures { buildConfig = true }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ksProps['storeFile']); storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']; keyPassword ksProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = true; shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDirs += [layout.buildDirectory.dir("genassets")] } }
    testOptions { unitTests.returnDefaultValues = true }
}

// Single source of truth: the parser lives in ../../Code.gs (also the Apps Script fallback).
tasks.register('copyParser', Copy) {
    from("${rootDir}/../Code.gs") { rename { 'parser.js' } }
    into layout.buildDirectory.dir("genassets")
}
preBuild.dependsOn copyParser

dependencies {
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    implementation 'org.mozilla:rhino:1.9.2'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'androidx.work:work-runtime:2.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814' // real org.json for JVM tests (android.jar ships stubs)
}
