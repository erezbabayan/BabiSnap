plugins { id 'com.android.application' }

def ksProps = new Properties()
def ksFile = file(System.getenv('VOICECAL_KEYSTORE_PROPS') ?: '/workspace/secrets/voicecal-keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
    namespace 'com.babisnap.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.babisnap.app'
        minSdk 26
        targetSdk 34
        versionCode 21
        versionName '2.10'
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ksProps['storeFile']); storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']; keyPassword ksProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true; shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { assets.srcDirs += ["$buildDir/genassets"] } }
    testOptions { unitTests.returnDefaultValues = true }
}

// Single source of truth: the parser lives in ../../Code.gs (also the Apps Script fallback).
tasks.register('copyParser', Copy) {
    from("${rootDir}/../Code.gs") { rename { 'parser.js' } }
    into "$buildDir/genassets"
}
preBuild.dependsOn copyParser

dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'org.mozilla:rhino:1.7.15.1'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303' // real org.json for JVM tests (android.jar ships stubs)
}
