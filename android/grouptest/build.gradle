plugins { id 'com.android.application' }

// Feasibility probe only. Debug signing (the default). No release keystore, no link to :app.
// lite: no accessibility, no notification listener, no sensitive permissions.
android {
    namespace = 'com.babisnap.grouptest'
    compileSdk = 35
    defaultConfig {
        minSdk = 26
        targetSdk = 34
        versionCode = 1
        versionName = 'k0'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig = true }
    testOptions { unitTests.returnDefaultValues = true }
    flavorDimensions = ['probe']
    productFlavors {
        full {
            dimension 'probe'
            applicationId = 'com.babisnap.grouptest'
            targetSdk = 34
            versionName = 'k0'
            buildConfigField 'boolean', 'LITE', 'false'
            buildConfigField 'boolean', 'AUTO', 'false'
        }
        lite {
            dimension 'probe'
            applicationId = 'com.babisnap.grouptest.lite'
            targetSdk = 35
            versionName = 'k0-lite'
            buildConfigField 'boolean', 'LITE', 'true'
            buildConfigField 'boolean', 'AUTO', 'false'
        }
        auto {
            dimension 'probe'
            applicationId = 'com.babisnap.grouptest.auto'
            targetSdk = 35
            versionName = 'k1-private'
            buildConfigField 'boolean', 'LITE', 'false'
            buildConfigField 'boolean', 'AUTO', 'true'
        }
    }
    buildTypes {
        debug {
            minifyEnabled = false
        }
        release {
            minifyEnabled = false
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
